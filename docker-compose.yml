
x-common-env: &commonenv
  SPRING_DATASOURCE_USERNAME: papazone
  SPRING_DATASOURCE_PASSWORD: ${MYSQL_DATABASE_PASSWORD:?MYSQL_DATABASE_PASSWORD is required}
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
  PUBSUB_ENABLED: "false"

services:

  mysql:
    image: mysql:8.0
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE_PASSWORD: ${MYSQL_DATABASE_PASSWORD:?MYSQL_DATABASE_PASSWORD is required}
    volumes:
      - mysqldata:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/init-user.sh:/docker-entrypoint-initdb.d/02-init-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  pubsub-emulator:
    image: google/cloud-sdk:emulators
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --host-port=0.0.0.0:8085
      - --project=local-project
    ports:
      - "8087:8085"

  discovery-server:
    build:
      context: ./backend
      dockerfile: ./discovery-server/Dockerfile
    ports:
      - "8761:8761"

  customer-service:
    build:
      context: ./backend
      dockerfile: ./customer-service/Dockerfile
    environment:
      <<: *commonenv
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_INSTANCE_HOSTNAME: customer-service
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/papazone_customer?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    ports:
      - "8081:8081"

  menu-service:
    build:
      context: ./backend
      dockerfile: ./menu-service/Dockerfile
    environment:
      <<: *commonenv
      EUREKA_INSTANCE_HOSTNAME: menu-service
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/papazone_menu?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    ports:
      - "8082:8082"
      - "127.0.0.1:5007:5007"

  cart-service:
    build:
      context: ./backend
      dockerfile: ./cart-service/Dockerfile
    environment:
      <<: *commonenv
      EUREKA_INSTANCE_HOSTNAME: cart-service
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/papazone_cart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MENU_SERVICE_URL: http://menu-service:8082
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
      menu-service:
        condition: service_started
    ports:
      - "8083:8083"

  payment-service:
    build:
      context: ./backend
      dockerfile: ./payment-service/Dockerfile
    environment:
      <<: *commonenv
      EUREKA_INSTANCE_HOSTNAME: payment-service
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/papazone_payments?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    ports:
      - "8085:8085"

  delivery-service:
    build:
      context: ./backend
      dockerfile: ./delivery-service/Dockerfile
    environment:
      <<: *commonenv
      EUREKA_INSTANCE_HOSTNAME: delivery-service
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/papazone_deliveries?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      PUBSUB_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    ports:
      - "8086:8086"

  order-service:
    build:
      context: ./backend
      dockerfile: ./order-service/Dockerfile
    environment:
      <<: *commonenv
      EUREKA_INSTANCE_HOSTNAME: order-service
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/papazone_orders?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      PUBSUB_ENABLED: "false"
      CART_SERVICE_URL: http://cart-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8085
      DELIVERY_SERVICE_URL: http://delivery-service:8086
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
      cart-service:
        condition: service_started
      menu-service:
        condition: service_started
    ports:
      - "8084:8084"
      - "5005:5005"

  ai-service:
    build:
      context: ./backend
      dockerfile: ./ai-service/Dockerfile
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: ai-service
      MENU_SERVICE_URL: http://menu-service:8082
      ORDER_SERVICE_URL: http://order-service:8084
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-2.5-flash}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
    depends_on:
      discovery-server:
        condition: service_started
      menu-service:
        condition: service_started
      order-service:
        condition: service_started
    ports:
      - "8088:8088"

  api-gateway:
    build:
      context: ./backend
      dockerfile: ./api-gateway/Dockerfile
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: api-gateway
    depends_on:
      - discovery-server
      - customer-service
      - menu-service
      - cart-service
      - order-service
      - payment-service
      - delivery-service
      - ai-service
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api-gateway
    ports:
      - "5173:80"

volumes:
  mysqldata:
