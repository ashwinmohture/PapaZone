
name: PapaZone CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: papazone-${{ github.ref }}
  cancel-in-progress: true

jobs:

  backend-tests:
    name: Backend Maven Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run backend tests
        run: mvn -B -f backend/pom.xml test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  docker-build-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ai-service
            dockerfile: backend/ai-service/Dockerfile
            context: backend

          - image: api-gateway
            dockerfile: backend/api-gateway/Dockerfile
            context: backend

          - image: cart-service
            dockerfile: backend/cart-service/Dockerfile
            context: backend

          - image: customer-service
            dockerfile: backend/customer-service/Dockerfile
            context: backend

          - image: delivery-service
            dockerfile: backend/delivery-service/Dockerfile
            context: backend

          - image: discovery-server
            dockerfile: backend/discovery-server/Dockerfile
            context: backend

          - image: menu-service
            dockerfile: backend/menu-service/Dockerfile
            context: backend

          - image: order-service
            dockerfile: backend/order-service/Dockerfile
            context: backend

          - image: payment-service
            dockerfile: backend/payment-service/Dockerfile
            context: backend

          - image: frontend
            dockerfile: frontend/Dockerfile
            context: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/ashwinmohture/papazone-${{ matrix.image }}:${{ github.sha }}
            ghcr.io/ashwinmohture/papazone-${{ matrix.image }}:latest


