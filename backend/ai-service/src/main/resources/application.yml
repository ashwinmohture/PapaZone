
server:
  port: 8088 # 8087 is used on the host by the Pub/Sub emulator

spring:
  application:
    name: ai-service

  ai:
    google:
      genai:
        embedding:
          api-key: ${GEMINI_API_KEY:}
          text:
            options:
              model: ${RAG_EMBEDDING_MODEL:gemini-embedding-001}
              dimensions: ${RAG_EMBEDDING_DIMENSIONS:768}
              task-type: RETRIEVAL_DOCUMENT

ai:
  timezone: ${AI_TIMEZONE:Asia/Kolkata}

  llm:
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    api-key: ${GEMINI_API_KEY:}
    model: ${AI_MODEL:gemini-3.8-flash}
    fallback-model: ${AI_FALLBACK_MODEL:gemini-3.7-flash}
    max-tokens: 1024
    timeout: ${AI_LLM_TIMEOUT:30s}

  services:
    menu-url: ${MENU_SERVICE_URL:http://localhost:8082}
    order-url: ${ORDER_SERVICE_URL:http://localhost:8084}

  limits:
    chat-per-minute: 12
    admin-per-minute: 20
    max-message-chars: 500
    max-history: 10

  security:
    # Same JWT_SECRET (base64) as customer-service. Used only to VERIFY tokens.
    # Blank = everyone is anonymous and the admin assistant is disabled.
    jwt-secret: ${JWT_SECRET:}

    # Shared secret for order-service /orders/export. Must match order-service.
    internal-key: ${INTERNAL_API_KEY:}

eureka:
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

# RAG configuration. This datasource is separate from the existing MySQL services.
rag:
  enabled: ${RAG_ENABLED:true}

  datasource:
    url: ${RAG_DB_URL:jdbc:postgresql://localhost:5433/papazone_vector}
    username: ${RAG_DB_USERNAME:papazone}
    password: ${RAG_DB_PASSWORD:papazone_vector_local}
    driver-class-name: org.postgresql.Driver

  embedding-dimensions: ${RAG_EMBEDDING_DIMENSIONS:768}
  top-k: ${RAG_TOP_K:5}
